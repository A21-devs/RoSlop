appId: dev.roslop.app
productName: RoSlop
artifactName: RoSlop-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!node_modules/**"
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Ad-hoc signed so Apple chips will run it. Not notarized yet.
  identity: "-"
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  target: AppImage
  category: Development
